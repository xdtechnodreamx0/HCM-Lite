# Local app + database. Published ports are bound to loopback.
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      APP_BASE_URL: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  app-demo:
    profiles: ["demo"]
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: hcm_lite_demo
      SESSION_SECRET: local-demo-only-change-before-deploy-1234567890
      APP_BASE_URL: http://localhost:3001
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - hcm_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hcm_mongo_data:
